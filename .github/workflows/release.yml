name: Build and Release

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        dnf install -y gcc make pkgconf-pkg-config openssl-devel xz-devel

    - name: Build binary
      run: |
        make clean
        make

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/sign-module
